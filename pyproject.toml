[project]
name = "traderbot"
version = "0.1.0"
description = "A personal paper trading bot: a claude desk proposes, a deterministic gate checks, Aditya approves"
authors = [
    { name = "Aditya Chunduri", email = "aditya2210.a1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py==0.44.0",
]

[project.scripts]
traderbot = "traderbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls Alpaca and claude (costs money)"]
addopts = "-m 'not live'"
